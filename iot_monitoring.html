<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Télémétrie IoT en direct | Robocare</title>
<style>
:root{--cyan:#06b6d4;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--border:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
svg{width:1em;height:1em;flex-shrink:0}
aside{width:260px;background:#0f172a;color:#fff;padding:1.5rem 1.25rem;position:sticky;top:0;height:100vh;flex-shrink:0}
aside b{display:block;margin:.5rem .5rem 2rem;font-size:1.25rem}
aside b span{color:var(--cyan)}
aside p{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:0 .5rem .5rem;font-weight:700}
.nav{padding:.85rem 1rem;border-radius:12px;background:var(--cyan);font-weight:600}
main{flex:1;min-width:0;padding:2rem 2.5rem}
h1,h2,.nav,.head,label{display:flex;align-items:center;gap:.6rem}
h1{font-size:1.85rem;margin-bottom:.3rem}
h1 svg{color:var(--cyan)}
header{margin-bottom:2rem;color:var(--muted);font-size:.92rem}
.stats,.nodes{display:grid;gap:1.25rem}
.stats{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:2rem}
.nodes{grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:1.5rem}
.card,.stat,.node{background:#fff;border:1px solid var(--border);border-radius:20px}
.card,.stat{box-shadow:0 10px 25px -5px rgba(15,23,42,.1);padding:1.75rem}
.stat{padding:1.35rem 1.5rem}
h2{font-size:1.2rem;margin-bottom:1.5rem}
.head{justify-content:space-between;margin-bottom:.75rem;color:var(--muted);font-size:.85rem}
.ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.value{font-size:2.1rem;font-weight:800;line-height:1.1}
.bar{height:8px;background:rgba(148,163,184,.2);border-radius:99px;overflow:hidden;margin-top:.35rem}
.bar div{height:100%;background:var(--c);transition:width .5s}
.node{padding:1.35rem;transition:.25s}
.node:hover{transform:translateY(-4px);border-color:var(--cyan)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:.65rem;padding:.35rem .75rem;background:rgba(148,163,184,.1);border-radius:8px;font-size:.88rem}
label{color:var(--muted);gap:.5rem}
.row span:last-child{font-weight:700}
input{width:84px;padding:.3rem .5rem;border-radius:8px;border:1px solid var(--border);background:none;font:inherit;text-align:right;outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.2)}
input.invalid{border-color:var(--red)}
@media(max-width:900px){aside{display:none}main{padding:1.25rem 1rem}h1{font-size:1.5rem}}
</style>
</head>
<body>
<aside>
  <b>ROBO<span>CARE</span></b>
  <p>Télémétrie IoT</p>
  <div class="nav"><i data-i="radio"></i> Télémétrie en direct</div>
</aside>
<main>
  <header>
    <h1><i data-i="radio"></i> Télémétrie en direct</h1>
    Flux continu de télémétrie des capteurs multi-zones
  </header>
  <div class="stats" id="stats"></div>
  <section class="card">
    <h2><i data-i="network"></i> Réseau de nœuds capteurs</h2>
    <div class="nodes" id="nodes"></div>
  </section>
</main>
<script>
const P = {
  radio: '<path d="M4.9 19.1a10 10 0 0 1 0-14.2M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M19.1 4.9a10 10 0 0 1 0 14.2"/><circle cx="12" cy="12" r="2"/>',
  network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/>',
  droplet: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  temp: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  wind: '<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(e => e.outerHTML = ic(e.dataset.i));
 
// k: clé · i/c: icône/couleur · l: libellé · u: unité · min/max: limites · s: titre de la carte stat · d: décimales · p: échelle de la barre
const M = [
  { k: "moisture", i: "droplet", c: "cyan", l: "Humidité du sol (10 cm)", u: "%", min: 0, max: 100, s: "Humidité du sol moy.", d: 0, p: 1 },
  { k: "temp", i: "temp", c: "amber", l: "Température", u: " °C", min: -20, max: 60, s: "Température moyenne", d: 1, p: 1 / .45 },
  { k: "humidity", i: "wind", c: "blue", l: "Humidité", u: "%", min: 0, max: 100, s: "Humidité moyenne", d: 0, p: 1 }
];
const nodes = [
  { name: "Passerelle 1", moisture: 42, temp: 27.5, humidity: 64 },
  { name: "Passerelle 2", moisture: 38, temp: 29.8, humidity: 71 },
  { name: "Passerelle 3", moisture: 22, temp: 34.2, humidity: 45 }
];
const $ = id => document.getElementById(id);
 
$("nodes").innerHTML = nodes.map((n, i) => `
  <div class="node"><h3>${n.name}</h3>${M.map(m => `
    <div class="row"><label><span style="color:var(--${m.c});display:flex">${ic(m.i)}</span>${m.l}</label>
    <span><input type="number" step=".1" min="${m.min}" max="${m.max}" data-i="${i}" data-k="${m.k}">${m.u}</span></div>`).join("")}
  </div>`).join("");
 
function refresh() {
  $("stats").innerHTML = M.map(m => {
    const a = +(nodes.reduce((s, n) => s + n[m.k], 0) / nodes.length).toFixed(m.d);
    return `<div class="stat" style="--c:var(--${m.c})">
      <div class="head">${m.s}<div class="ico">${ic(m.i)}</div></div>
      <div class="value">${a}${m.u}</div>
      <div class="bar"><div style="width:${Math.min(100, Math.max(0, a * m.p))}%"></div></div></div>`;
  }).join("");
  document.querySelectorAll("#nodes input").forEach(x => x !== document.activeElement && (x.value = nodes[x.dataset.i][x.dataset.k]));
}
 
$("nodes").addEventListener("input", ({ target: x }) => {
  const { i, k } = x.dataset, m = M.find(m => m.k === k), v = parseFloat(x.value), ok = v >= m.min && v <= m.max;
  x.classList.toggle("invalid", !ok);
  if (ok) { nodes[i][k] = v; refresh(); }
});
// À la sortie du champ : restaure la dernière valeur valide
$("nodes").addEventListener("change", ({ target: x }) => {
  x.classList.remove("invalid");
  x.value = nodes[x.dataset.i][x.dataset.k];
});
refresh();
</script>
</body>
</html>
