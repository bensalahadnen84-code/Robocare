<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Télémétrie IoT en direct | Robocare</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#06b6d4;--green:#10b981;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;--border:rgba(226,232,240,.8);--muted:#64748b;--shadow:0 10px 25px -5px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex}
.sidebar{width:280px;background:#0f172a;color:#fff;padding:1.5rem 1.25rem;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:block;margin:.5rem .5rem 2rem;font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none}
.brand span{color:var(--cyan)}
.side-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:0 .5rem .5rem;font-weight:700}
.nav-item{display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;border-radius:12px;background:var(--cyan);font-weight:600;box-shadow:0 4px 14px rgba(6,182,212,.35)}
main{flex:1;padding:2rem 2.5rem;max-width:1500px;overflow-x:hidden}
header{margin-bottom:2rem}
h1,h2,.stat-head,.sub,.row label{display:flex;align-items:center;gap:.6rem}
h1{font-size:1.85rem;gap:.75rem}
header p,.card-head span{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.25rem;margin-bottom:2rem}
.card,.stat,.node{background:#fff;border:1px solid var(--border);border-radius:20px}
.stat,.card{box-shadow:var(--shadow)}
.stat{padding:1.35rem 1.5rem}
.stat-head{justify-content:space-between;margin-bottom:.75rem;color:var(--muted);font-size:.85rem;font-weight:500}
.icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.icon,.badge{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.value{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.bar{height:8px;background:rgba(148,163,184,.2);border-radius:999px;overflow:hidden;margin-top:.35rem}
.bar div{height:100%;background:var(--c);border-radius:999px;transition:width .5s}
.sub{font-size:.78rem;margin-top:.5rem;color:var(--c);gap:.3rem}
.card{padding:1.75rem}
.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem}
h2{font-size:1.2rem}
.card-head span{font-size:.82rem}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.5rem}
.node{padding:1.35rem;transition:.25s}
.node:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--cyan)}
.node-head,.row,.node-foot{display:flex;justify-content:space-between;align-items:center}
.node-head small{font-size:.78rem;color:var(--muted)}
.badge{padding:.3rem .75rem;border-radius:999px;font-size:.75rem;font-weight:700}
.rows{display:flex;flex-direction:column;gap:.65rem;margin:1rem 0;font-size:.88rem}
.row{padding:.35rem .75rem;background:rgba(148,163,184,.08);border-radius:8px}
.row label{color:var(--muted);font-weight:500;gap:.5rem}
.field{display:flex;align-items:center;gap:.3rem;font-weight:700}
.field input{width:84px;padding:.3rem .5rem;border-radius:8px;border:1px solid var(--border);color:inherit;font:inherit;text-align:right;outline:none;transition:.2s}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.2)}
.field input.invalid{border-color:var(--red)}
.node-foot{font-size:.78rem;color:var(--muted);padding-top:.75rem;border-top:1px solid var(--border)}
.node-foot .field{font-weight:600}
.node-foot input{width:64px;font-size:.78rem}
@media(max-width:1024px){.sidebar{width:80px;padding:1.25rem .5rem}.brand,.side-label,.nav-item span{display:none}.nav-item{justify-content:center}main{padding:1.5rem}}
</style>
</head>
<body>
<aside class="sidebar">
  <a href="index.html" class="brand">ROBO<span>CARE</span></a>
  <div class="side-label">Télémétrie IoT</div>
  <div class="nav-item"><i class="fas fa-tower-cell"></i><span>Télémétrie en direct</span></div>
</aside>
<main>
  <header>
    <h1><i class="fas fa-satellite-dish" style="color:var(--cyan)"></i> Télémétrie en direct</h1>
    <p>Flux continu de télémétrie des capteurs multi-zones</p>
  </header>
  <div class="stats" id="stats"></div>
  <section class="card">
    <div class="card-head">
      <h2><i class="fas fa-network-wired"></i> Réseau de nœuds capteurs</h2>
      <span>Flux de données actualisé automatiquement toutes les 3 s · valeurs modifiables</span>
    </div>
    <div class="nodes" id="nodes"></div>
  </section>
</main>
<script>
const L = { moisture: [0, 100], temp: [-20, 60], humidity: [0, 100], battery: [0, 100] };
const ROWS = [["moisture", "droplet", "cyan", "Humidité du sol (10 cm)", "%"], ["temp", "temperature-half", "amber", "Température", "°C"], ["humidity", "wind", "blue", "Humidité", "%"]];
const nodes = [
  { id: "NODE-01", name: "Passerelle 1", moisture: 42, temp: 27.5, humidity: 64, battery: 92, rssi: -68 },
  { id: "NODE-02", name: "Passerelle 2", moisture: 38, temp: 29.8, humidity: 71, battery: 85, rssi: -72 },
  { id: "NODE-03", name: "Passerelle 3", moisture: 22, temp: 34.2, humidity: 45, battery: 78, rssi: -81 }
];
const $ = id => document.getElementById(id);
const avg = (k, d = 0) => +(nodes.reduce((a, n) => a + n[k], 0) / nodes.length).toFixed(d);
const clamp = (v, a, b) => Math.round(Math.min(b, Math.max(a, v)) * 10) / 10;
const field = (i, k, u, s = .1) => `<span class="field"><input type="number" step="${s}" min="${L[k][0]}" max="${L[k][1]}" data-i="${i}" data-k="${k}" value="${nodes[i][k]}">${u}</span>`;
 
function renderStats() {
  const m = avg("moisture"), t = avg("temp", 1), h = avg("humidity"), n = nodes.length;
  $("stats").innerHTML = [
    ["Humidité du sol moy.", "droplet", "cyan", `${m}%`, m, "check-circle", "Optimale (35 % - 60 %)"],
    ["Température moyenne", "temperature-half", "amber", `${t} °C`, t / .45, "sun", "Plage normale de la journée"],
    ["Humidité moyenne", "wind", "blue", `${h}%`, h, "cloud", "Bonne humidité pour les cultures"],
    ["Capteurs actifs", "tower-broadcast", "purple", `${n} / ${n}`, null, "wifi", "Tous les nœuds en ligne (100 %)"]
  ].map(([label, icon, c, val, pct, si, sub]) => `
    <div class="stat" style="--c:var(--${c})">
      <div class="stat-head">${label}<div class="icon"><i class="fas fa-${icon}"></i></div></div>
      <div class="value">${val}</div>
      ${pct === null ? "" : `<div class="bar"><div style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>`}
      <div class="sub"><i class="fas fa-${si}"></i> ${sub}</div>
    </div>`).join("");
}
 
$("nodes").innerHTML = nodes.map((n, i) => `
  <div class="node">
    <div class="node-head">
      <div><h3>${n.name}</h3><small>${n.id} • ${n.rssi} dBm</small></div>
      <span class="badge"></span>
    </div>
    <div class="rows">${ROWS.map(([k, ic, c, label, u]) =>
      `<div class="row"><label><i class="fas fa-${ic}" style="color:var(--${c})"></i> ${label}</label>${field(i, k, u)}</div>`).join("")}
    </div>
    <div class="node-foot">
      <span class="field"><i class="fas fa-battery-three-quarters"></i> Batterie : ${field(i, "battery", "%", 1)}</span>
      <span><i class="fas fa-clock"></i> Mis à jour à l'instant</span>
    </div>
  </div>`).join("");
 
// Met à jour l'affichage sans toucher au champ en cours de saisie
function refresh() {
  renderStats();
  [...$("nodes").children].forEach((card, i) => {
    card.querySelectorAll("input").forEach(x => x !== document.activeElement && (x.value = nodes[i][x.dataset.k]));
    const alert = nodes[i].moisture < 25, b = card.querySelector(".badge");
    b.textContent = alert ? "Alerte" : "Actif";
    b.style.setProperty("--c", `var(--${alert ? "red" : "green"})`);
  });
}
 
$("nodes").addEventListener("input", ({ target: x }) => {
  const { i, k } = x.dataset, v = parseFloat(x.value);
  const ok = v >= L[k][0] && v <= L[k][1];
  x.classList.toggle("invalid", !ok);
  if (ok) { nodes[i][k] = v; refresh(); }
});
 
// En quittant le champ : restaure la dernière valeur valide si la saisie est vide ou hors bornes
$("nodes").addEventListener("change", ({ target: x }) => {
  x.classList.remove("invalid");
  x.value = nodes[x.dataset.i][x.dataset.k];
});
 
refresh();
setInterval(() => {
  [...$("nodes").children].forEach((card, i) => {
    if (card.contains(document.activeElement)) return;
    const n = nodes[i];
    n.moisture = clamp(n.moisture + (Math.random() - .48) * 1.2, 15, 95);
    n.temp = clamp(n.temp + (Math.random() - .48) * .4, 10, 48);
    n.humidity = clamp(n.humidity + (Math.random() - .48) * .8, 20, 95);
  });
  refresh();
}, 3500);
</script>
</body>
</html>
